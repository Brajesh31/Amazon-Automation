name: Documentation Integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Verify documentation package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify documentation files
        shell: bash
        run: |
          set -euo pipefail
          files=(
            README.md
            LICENSE
            CONTRIBUTING.md
            CODE_OF_CONDUCT.md
            SECURITY.md
            SUPPORT.md
            CHANGELOG.md
            ROADMAP.md
            CITATION.cff
            CODEOWNERS
            docs/README.md
            docs/architecture.md
            docs/installation.md
            docs/development.md
            docs/browser-and-driver.md
            docs/configuration.md
            docs/workflow.md
            docs/api.md
            docs/testing.md
            docs/security-and-privacy.md
            docs/deployment.md
            docs/operations.md
            docs/limitations.md
            docs/faq.md
            docs/database.md
            docs/troubleshooting.md
          )
          for file in "${files[@]}"; do
            test -s "$file" || { echo "::error file=$file::Missing or empty file"; exit 1; }
          done
          echo "Verified ${#files[@]} documentation and governance files."
