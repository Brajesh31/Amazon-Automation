name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python and repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python source
        run: python -m py_compile main.py

      - name: Validate required documentation
        run: |
          set -eu
          for file in README.md LICENSE CONTRIBUTING.md CODE_OF_CONDUCT.md SECURITY.md SUPPORT.md CHANGELOG.md ROADMAP.md CITATION.cff CODEOWNERS docs/README.md docs/architecture.md docs/installation.md docs/development.md docs/browser-and-driver.md docs/configuration.md docs/workflow.md docs/api.md docs/testing.md docs/security-and-privacy.md docs/deployment.md docs/operations.md docs/limitations.md docs/faq.md docs/database.md docs/troubleshooting.md; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          echo "All required project and documentation files exist."
