name: Feature request
description: Propose a safe and maintainable improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or developer need should this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful implementation.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety review
      options:
        - label: This does not bypass authentication, CAPTCHA, rate limits, anti-bot controls, fraud safeguards or purchase confirmation.
          required: true
        - label: This does not add checkout, payment submission or unattended purchasing behavior.
          required: true
