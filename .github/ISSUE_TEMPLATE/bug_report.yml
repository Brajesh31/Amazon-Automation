name: Bug report
description: Report a reproducible issue in the Python project or repository checks.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, cookies, account data, payment information, browser profiles or private screenshots.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain the observed and expected behavior.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.x"
    validations:
      required: true
  - type: input
    id: selenium
    attributes:
      label: Selenium version
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Chrome and driver version
    validations:
      required: false
  - type: textarea
    id: reproduction
    attributes:
      label: Sanitized reproduction steps
    validations:
      required: true
